<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>aNOTATE // Audio to MIDI Studio</title>
    <style>
        body { font-family: monospace; background: #121212; color: #00ff66; padding: 2rem; }
        .card { border: 1px solid #00ff66; padding: 1.5rem; max-width: 600px; margin: 0 auto; }
        button { background: #00ff66; color: #121212; border: none; padding: 0.5rem 1rem; cursor: pointer; font-weight: bold; }
        #status { margin-top: 1rem; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>// aNOTATE STUDIO GATEWAY</h2>
        <input type="file" id="audioInput" accept="audio/*">
        <button onclick="uploadFile()">PROCESS TRACK</button>
        <div id="status">Status: Idle</div>
        <div id="download"></div>
    </div>

    <script>
        async function uploadFile() {
            const input = document.getElementById('audioInput');
            if (!input.files[0]) return alert('Select a file');

            const formData = new FormData();
            formData.append('file', input.files[0]);

            document.getElementById('status').innerText = 'Status: Uploading track...';

            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await res.json();
            
            checkStatus(data.task_id, input.files[0].name.split('.')[0]);
        }

        async function checkStatus(taskId, baseName) {
            const interval = setInterval(async () => {
                const res = await fetch(`/api/status/${taskId}`);
                const data = await res.json();

                document.getElementById('status').innerText = `Status: ${data.status}`;

                if (data.status === 'SUCCESS') {
                    clearInterval(interval);
                    document.getElementById('download').innerHTML = `
                        <p>Separation & Extraction Complete!</p>
                        <a href="/media/${baseName}_output.mid" download style="color:#00ff66;">Download Multi-Track MIDI</a>
                    `;
                } else if (data.status === 'FAILURE') {
                    clearInterval(interval);
                    document.getElementById('status').innerText = 'Status: Processing Failed';
                }
            }, 3000);
        }
    </script>
</body>
</html>
